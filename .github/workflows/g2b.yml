name: 나라장터 용역입찰 수집

# 나라장터를 본 워크플로우에서 분리한 이유
#
# 용역 입찰은 채용공고와 마감 성격이 완전히 다르다. 소액 수의시담은 공고 당일
# 오전에 마감된다 — 실측: 932만원 감리용역이 07:59 공고 → 10:00 마감.
# 하루 2회(09:07/15:07)로는 오후에 올라온 건이 다음날엔 이미 끝나 있다.
# 실제로 한 번 실행에서 서울 발주 301건 중 90건(30%)이 이미 마감 상태였다.
#
# 이 소스는 API 라 실행당 4요청 · 약 15초로 매우 가볍다. 평일 업무시간 매시간
# 돌려도 하루 36요청으로 개발계정 일일 한도 1,000건의 4% 수준이다.
#
# concurrency group 은 cron.yml 과 **분리**한다. 같은 이름이면 수목 수집이
# 도는 동안 이쪽 대기 실행이 취소된다(실측: 평일 9회 중 2회만 실행).
#
# 상태 파일도 cron.yml 과 **분리**한다(seen-g2b.json). 두 워크플로우가 겹쳐
# 돌 때 같은 파일을 고치면 rebase 가 충돌하고, 한 번 충돌하면 리베이스가
# 걸린 채 남아 재시도가 전부 즉시 실패한다 — 그 실행분 상태가 통째로
# 버려져 다음 실행에서 전부 재발송된다(실측: 2026-10-28 수목 실행분).
# 두 워크플로우가 돌리는 소스는 서로 겹치지 않으므로 나눠도 누락은 없다.

on:
  schedule:
    # UTC 0~8시 = KST 9~17시, 평일만. 분은 정시를 피해 17분.
    # KST 09:10~17:10 매시. 업무시간·공휴일 판정은 main.py 가 실행 시점에
    # 한다(GitHub cron 이 4~7시간씩 밀려 cron 식만으로는 막지 못한다).
    - cron: "10 0-8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 로그만 확인"
        type: boolean
        default: false

concurrency:
  group: treework-collect-g2b   # cron.yml 과 분리 (위 주석 참고)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: Claude CLI 설치 (구독 경로를 쓸 때만)
        # ANTHROPIC_API_KEY 가 있으면 pip 의 anthropic 으로 호출하므로 CLI 가
        # 필요 없다. npm install 이 매 실행 20~30초를 먹으니 꼭 필요할 때만.
        #
        # 판단은 반드시 셸 안에서 한다. secrets 컨텍스트는 step 의 if: 에서
        # 쓸 수 없고, 쓰면 워크플로우가 통째로 파싱되지 않아 "No jobs were run"
        # 으로 죽는다(실측: 2026-10-27~28 수집 전면 중단). env: 로는 쓸 수 있다.
        env:
          SUB_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$SUB_TOKEN" && -z "$API_KEY" ]]; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "구독 경로가 아님 — CLI 설치를 건너뜁니다"
          fi

      # 규칙이 깨진 상태로 수집하면 조용히 오탐·누락이 발생한다. 몇 초면 끝난다.
      - name: 회귀 테스트
        run: |
          python tests/test_workflows.py
          python tests/test_watchdog.py
          python tests/test_filters.py
          python tests/test_service_key.py
          python tests/test_schedule_ai.py
          python tests/test_template.py
          python tests/test_notify.py
          python tests/test_region.py

      - name: 나라장터만 수집
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          # AI 선별용. 둘 다 없으면 AI 없이 평소대로 동작한다(fail-open).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python main.py --state seen-g2b.json --source g2b-servc --source g2b-it ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 상태 파일 커밋
        if: always() && steps.run.outcome == 'success'
        env:
          STATE: seen-g2b.json
        run: |
          if [[ -z "$(git status --porcelain "$STATE")" ]]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$STATE" "${RUNNER_TEMP:-/tmp}/state.json"
          # rebase 를 쓰지 않는다. 이 파일은 이 워크플로우만 쓰므로 원격 최신
          # 위에 우리 것을 그대로 얹으면 된다. 충돌할 여지를 아예 없앤다.
          for i in 1 2 3; do
            git fetch -q origin "+${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP:-/tmp}/state.json" "$STATE"
            git add "$STATE"
            if git diff --cached --quiet; then
              echo "원격이 이미 같은 내용 — 커밋 생략"; exit 0
            fi
            git commit -qm "chore: 나라장터 발송 이력 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          echo "::error::상태 파일을 커밋하지 못했습니다 — 다음 실행에서 중복 발송이 생깁니다"
          exit 1

      # 스크립트가 죽으면 스크립트는 알릴 수 없다. 침묵을 막는다.
      - name: 실패 알림
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 <b>나라장터 수집이 실패했습니다</b>\n\n<a href="%s">실행 로그 보기</a>' "$URL")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"
