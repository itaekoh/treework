name: 나라장터 용역입찰 수집

# 나라장터를 본 워크플로우에서 분리한 이유
#
# 용역 입찰은 채용공고와 마감 성격이 완전히 다르다. 소액 수의시담은 공고 당일
# 오전에 마감된다 — 실측: 932만원 감리용역이 07:59 공고 → 10:00 마감.
# 하루 2회(09:07/15:07)로는 오후에 올라온 건이 다음날엔 이미 끝나 있다.
# 실제로 한 번 실행에서 서울 발주 301건 중 90건(30%)이 이미 마감 상태였다.
#
# 이 소스는 API 라 실행당 4요청 · 약 15초로 매우 가볍다. 평일 업무시간 매시간
# 돌려도 하루 36요청으로 개발계정 일일 한도 1,000건의 4% 수준이다.
#
# 중복 발송은 seen.json 을 본 워크플로우와 공유하므로 자동으로 방지된다.
# 두 워크플로우가 동시에 돌면 seen.json 커밋이 충돌하므로 concurrency group 을
# cron.yml 과 같은 이름으로 두어 직렬화한다.

on:
  schedule:
    # UTC 0~8시 = KST 9~17시, 평일만. 분은 정시를 피해 17분.
    - cron: "17 0-8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 로그만 확인"
        type: boolean
        default: false

concurrency:
  group: treework-collect      # cron.yml 과 동일 — seen.json 커밋 충돌 방지
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 나라장터만 수집
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: |
          python main.py --source g2b-servc ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: seen.json 커밋
        if: always() && steps.run.outcome == 'success'
        run: |
          if [[ -z "$(git status --porcelain seen.json)" ]]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: 나라장터 발송 이력 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          exit 1

      # 스크립트가 죽으면 스크립트는 알릴 수 없다. 침묵을 막는다.
      - name: 실패 알림
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 <b>나라장터 수집이 실패했습니다</b>\n\n<a href="%s">실행 로그 보기</a>' "$URL")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"
