name: 수목 공고 수집

on:
  schedule:
    # GitHub Actions 는 UTC 기준. KST = UTC+9.
    #
    # ⚠️ GitHub 의 schedule 은 신뢰할 수 없다. 부하가 몰리면 수십 분 지연되고
    #    아예 스킵되기도 한다(실측: 2026-08-05 아침 실행이 통째로 누락됐다).
    #    하루 2회에 의존하면 한 번 스킵될 때 그날이 통째로 빈다.
    #    중복 발송은 seen.json 이 막아주므로 실행을 늘리는 비용이 사실상 없다.
    #    → 오전 2회 + 오후 2회로 이중화한다. 하나만 돌아도 그날은 커버된다.
    #
    # 분은 0/15/30/45 처럼 몰리는 값을 피해 흩뿌린다.
    # 평일(UTC 1-5 = KST 월~금, 이 시간대에서는 요일이 어긋나지 않는다)만.
    # 공휴일과 업무시간은 cron 으로 표현할 수 없어 main.py 가 실행 시점에
    # 다시 본다(treework/timeutil.business_status).
    #
    # 실측: GitHub cron 은 예정보다 4~7시간 늦게 뜬다. 그래서 창 앞쪽에
    # 촘촘히 걸어 둔다 — 늦게 떠도 어느 하나는 업무시간 안에 들어온다.
    # 업무시간 밖에 뜬 실행은 20초쯤 쓰고 조용히 끝나므로 비용이 거의 없다.
    - cron: "10 0 * * 1-5"    # 09:10 KST
    - cron: "10 2 * * 1-5"    # 11:10 KST
    - cron: "10 4 * * 1-5"    # 13:10 KST
    - cron: "10 6 * * 1-5"    # 15:10 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발송하지 않고 로그만 확인"
        type: boolean
        default: false

# g2b.yml 과 **다른** group 을 쓴다. 같은 이름을 쓰면 한쪽이 도는 동안
# 다른 쪽의 대기 실행이 취소된다(GitHub 은 group 당 pending 을 1개만 유지한다).
# 실측: 나라장터가 평일 9회 예정 중 2회만 실행됐다.
#
# 상태 파일도 분리돼 있다(이쪽 seen.json / 나라장터 seen-g2b.json). 같은
# 파일을 쓰면 겹쳐 돌 때 rebase 가 충돌하고, 한 번 충돌하면 리베이스가 걸린
# 채 남아 재시도가 전부 즉시 실패한다 — 그 실행분 상태가 통째로 버려진다
# (실측: 2026-10-28). 자세한 내용은 g2b.yml 머리말 참고.
concurrency:
  group: treework-collect-tree
  cancel-in-progress: false

permissions:
  contents: write        # seen.json 커밋용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: Claude CLI 설치 (구독 경로를 쓸 때만)
        # ANTHROPIC_API_KEY 가 있으면 pip 의 anthropic 으로 호출하므로 CLI 가
        # 필요 없다. npm install 이 매 실행 20~30초를 먹으니 꼭 필요할 때만.
        #
        # 판단은 반드시 셸 안에서 한다. secrets 컨텍스트는 step 의 if: 에서
        # 쓸 수 없고, 쓰면 워크플로우가 통째로 파싱되지 않아 "No jobs were run"
        # 으로 죽는다(실측: 2026-10-27~28 수집 전면 중단). env: 로는 쓸 수 있다.
        env:
          SUB_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -n "$SUB_TOKEN" && -z "$API_KEY" ]]; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "구독 경로가 아님 — CLI 설치를 건너뜁니다"
          fi

      # 키워드/등급 규칙이 깨진 상태로 수집하면 조용히 오탐·누락이 발생한다.
      # 몇 초면 끝나므로 매 실행 앞단에서 확인한다.
      - name: 회귀 테스트
        run: |
          python tests/test_workflows.py
          python tests/test_watchdog.py
          python tests/test_filters.py
          python tests/test_service_key.py
          python tests/test_schedule_ai.py
          python tests/test_template.py
          python tests/test_notify.py
          python tests/test_region.py

      - name: 수집 및 발송
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 미설정이면 나라장터 소스만 '건너뜀'으로 처리되고 경고는 뜨지 않는다
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        # 나라장터는 마감이 당일인 건이 많아 g2b.yml 에서 평일 매시간 따로 돈다
          # AI 선별용. 둘 다 없으면 AI 없이 평소대로 동작한다(fail-open).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python main.py --exclude g2b-servc --exclude g2b-it ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 상태 파일 커밋
        # 발송이 실패하면 main.py 가 상태를 저장하지 않고 종료하므로
        # 변경이 없으면 커밋도 건너뛴다.
        if: always() && steps.run.outcome == 'success'
        env:
          STATE: seen.json
        run: |
          if [[ -z "$(git status --porcelain "$STATE")" ]]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$STATE" "${RUNNER_TEMP:-/tmp}/state.json"
          # rebase 를 쓰지 않는다. 이 파일은 이 워크플로우만 쓰므로 원격 최신
          # 위에 우리 것을 그대로 얹으면 된다. 충돌할 여지를 아예 없앤다.
          for i in 1 2 3; do
            git fetch -q origin "+${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP:-/tmp}/state.json" "$STATE"
            git add "$STATE"
            if git diff --cached --quiet; then
              echo "원격이 이미 같은 내용 — 커밋 생략"; exit 0
            fi
            git commit -qm "chore: 발송 이력 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 재시도 $i"; sleep 5
          done
          echo "::error::상태 파일을 커밋하지 못했습니다 — 다음 실행에서 중복 발송이 생깁니다"
          exit 1

      # ── 스크립트가 죽으면 텔레그램을 보낼 주체가 없어진다.        ──
      # ── 이 경우를 워크플로우 레벨에서 잡아 '침묵'을 막는다.        ──
      - name: 실패 알림
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 <b>수집 작업 자체가 실패했습니다</b>\n\n스크립트가 중단되어 공고 알림이 발송되지 않았습니다.\n의존성 오류, 사이트 전면 개편, IP 차단 등을 확인하세요.\n\n<a href="%s">실행 로그 보기</a>' "$URL")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"

  # ── 주 1회 자기 점검: 모든 소스가 실제로 파싱되는지 확인한다.   ──
  # ── 공고가 없는 조용한 주에도 파서가 살아있는지 알 수 있다.      ──
  selftest:
    # 어느 cron 이 깨웠는지는 github.event.schedule 이 정확히 알려 준다.
    # 시각으로 거르면 안 된다 — Actions 는 4~7시간씩 밀리므로 '오전 2시 이전'
    # 같은 조건은 밀린 주에 통째로 건너뛴다.
    if: github.event_name == 'schedule' && github.event.schedule == '10 0 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 소스 헬스 점검 (주 1회, 월요일)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 미설정이면 나라장터 소스만 '건너뜀'으로 처리되고 경고는 뜨지 않는다
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: |
          # 첫 cron 은 평일 매일 뜨므로 요일만 더 본다. 밀려도 같은 날
          # 안에서 끝나므로(실측 지연 4~7시간) 요일은 어긋나지 않는다.
          if [[ "$(date -u +%u)" != "1" ]]; then
            echo "월요일이 아님 — 건너뜀"; exit 0
          fi
          python selftest.py
