name: 텔레그램 설정 도우미

# 국내에서는 ISP 레벨 필터링으로 api.telegram.org 직접 접근이 막히는 경우가 있다
# (DNS 는 되고 TCP 443 이 실패). 그러면 로컬에서 getUpdates 로 chat_id 를 알아낼
# 수 없다. 이 워크플로우는 GitHub Actions 러너(해외 IP)에서 대신 조회해준다.
# 발송 경로 자체가 살아있는지도 같이 검증한다.
#
# 사용법
#   1) Secret TELEGRAM_BOT_TOKEN 만 먼저 등록
#   2) 텔레그램 앱에서 본인 봇에게 아무 메시지나 보낸다  ← 안 보내면 조회 결과가 비어 있다
#   3) Actions 탭에서 이 워크플로우를 Run workflow
#   4) 로그에 나온 chat_id 를 Secret TELEGRAM_CHAT_ID 로 등록
#
# ⚠️ Public 저장소는 Actions 로그가 공개된다. chat_id 만으로는 아무 것도 할 수
#    없지만(봇 토큰이 있어야 함), 신경 쓰이면 확인 후 해당 실행 기록을 삭제하거나
#    이 워크플로우 파일을 지워도 된다.

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "찾은 chat_id 로 테스트 메시지도 보낼까요"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: chat_id 조회
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEND: ${{ inputs.send_test }}
        run: |
          set -uo pipefail

          if [[ -z "${TOKEN:-}" ]]; then
            echo "::error::Secret TELEGRAM_BOT_TOKEN 이 없습니다. 먼저 등록하세요."
            exit 1
          fi

          echo "── 봇 정보 확인 ──"
          ME=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/getMe")
          if [[ "$(echo "$ME" | jq -r '.ok')" != "true" ]]; then
            echo "::error::봇 토큰이 유효하지 않습니다."
            echo "$ME" | jq -r '"  오류: \(.error_code) \(.description)"' || echo "$ME"
            exit 1
          fi
          echo "$ME" | jq -r '"  봇 이름: \(.result.first_name)  (@\(.result.username))"'
          echo "  ✅ Actions 에서 api.telegram.org 접근 정상 — 발송 경로에 문제 없습니다."

          echo
          echo "── chat_id 조회 ──"
          UP=$(curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/getUpdates")
          COUNT=$(echo "$UP" | jq '.result | length' 2>/dev/null || echo 0)
          COUNT=${COUNT:-0}

          # 웹훅이 설정돼 있으면 getUpdates 는 항상 409 를 준다
          if [[ "$(echo "$UP" | jq -r '.ok // "false"')" != "true" ]]; then
            echo "::error::getUpdates 실패"
            echo "$UP" | jq -r '"  \(.error_code) \(.description)"' 2>/dev/null || echo "$UP"
            echo "  409 Conflict 라면 이 봇에 웹훅이 걸려 있습니다."
            echo "  해제: curl \"https://api.telegram.org/bot<토큰>/deleteWebhook\""
            exit 1
          fi

          if [[ "$COUNT" == "0" ]]; then
            echo "::error::받은 메시지가 없습니다."
            echo "텔레그램 앱에서 본인 봇(@$(echo "$ME" | jq -r '.result.username'))에게"
            echo "아무 메시지나 먼저 보낸 뒤 이 워크플로우를 다시 실행하세요."
            echo "(봇을 그룹에 넣었다면 그룹에서 메시지를 보내세요)"
            exit 1
          fi

          echo "  메시지 ${COUNT}건 발견"
          echo
          echo "발견된 chat_id 목록:"
          echo "$UP" | jq -r '
            [.result[]
             | (.message // .edited_message // .channel_post // empty).chat
             | select(. != null)] | unique_by(.id) | .[]
            | "  chat_id = \(.id)   type=\(.type)   name=\(.title // ((.first_name // "") + " " + (.last_name // "")) | ltrimstr(" ") | rtrimstr(" "))"'

          CHAT=$(echo "$UP" | jq -r '
            [.result[]
             | (.message // .edited_message // .channel_post // empty).chat.id
             | select(. != null)] | last')

          if [[ -z "$CHAT" || "$CHAT" == "null" ]]; then
            echo "::error::업데이트는 있으나 chat 정보를 찾지 못했습니다."
            echo "봇에게 직접 텍스트 메시지를 보낸 뒤 다시 실행하세요."
            exit 1
          fi

          NCHAT=$(echo "$UP" | jq '
            [.result[]
             | (.message // .edited_message // .channel_post // empty).chat.id
             | select(. != null)] | unique | length')
          if [[ "${NCHAT:-1}" -gt 1 ]]; then
            echo "  ⚠️ 여러 채팅이 발견됐습니다. 아래 값은 '가장 최근' 채팅입니다."
            echo "     원하는 채팅이 다르면 위 목록에서 골라 쓰세요."
          fi

          echo
          echo "════════════════════════════════════════════════════"
          echo "  Secret TELEGRAM_CHAT_ID 에 넣을 값:  ${CHAT}"
          echo "════════════════════════════════════════════════════"
          echo
          echo "## ✅ chat_id = \`${CHAT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "이 값을 Secret \`TELEGRAM_CHAT_ID\` 로 등록하세요." >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SEND" == "true" ]]; then
            echo "── 테스트 메시지 발송 ──"
            TEXT=$(printf '🌳 <b>TreeWork 연결 성공</b>\n\n이 메시지가 보이면 발송 경로가 정상입니다.\nSecret <code>TELEGRAM_CHAT_ID</code> 에 <code>%s</code> 를 등록하고\n"수목 공고 수집" 워크플로우를 실행하세요.' "$CHAT")
            RES=$(curl -sS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="${CHAT}" -d parse_mode="HTML" \
              --data-urlencode text="$TEXT")
            if [[ "$(echo "$RES" | jq -r '.ok')" == "true" ]]; then
              echo "  ✅ 발송 성공 — 텔레그램 앱을 확인하세요."
            else
              echo "::warning::발송 실패"
              echo "$RES" | jq -r '"  \(.error_code) \(.description)"' || echo "$RES"
            fi
          fi
