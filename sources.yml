  - {id: gu-yongsan-n,   name: 용산구 고시/공고, org: 용산구, kind: generic_table, enabled: true,
     list_url: "https://www.yongsan.go.kr/portal/bbs/B0000095/list.do?menuNo=200233"}
  - {id: gu-ep-n,        name: 은평구 고시/공고, org: 은평구, kind: generic_table, enabled: true,
     list_url: "https://www.ep.go.kr/www/selectEminwonList.do?key=754&notAncmtSeCode=01"}
  - {id: gu-ep-r,        name: 은평구 채용공고,  org: 은평구, kind: generic_table, enabled: true,
