  - {id: gu-gangdong-r,  name: 강동구 채용공고,  org: 강동구, kind: generic_table, enabled: true,
     list_url: "https://www.gangdong.go.kr/web/newportal/notice/02"}
  - {id: gu-gangseo-n,   name: 강서구 고시공고,  org: 강서구, kind: generic_table, enabled: true,
     list_url: "https://www.gangseo.seoul.kr/gs040301"}
  - {id: gu-gangseo-r,   name: 강서구 채용공고,  org: 강서구, kind: generic_table, enabled: true,
     list_url: "https://www.gangseo.seoul.kr/gs040302"}
  - {id: gu-gwanak-n,    name: 관악구 고시공고,  org: 관악구, kind: generic_table, enabled: true,
