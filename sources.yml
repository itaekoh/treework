     list_url: "https://www.jungnang.go.kr/portal/bbs/list/B0000118.do?menuNo=200476"}

  # ─────────────────────────────────────────────────────────────
  # 5. 나라장터 입찰공고 (용역)
  #    나무의사 실수요는 채용보다 용역 발주로 나오는 경우가 많다.
  #    채용공고와 달리 용역은 공고명이 서술적이라('○○구 생활권 수목 진료 용역')
  #    공고명 키워드 검색이 잘 듣는다 → 키워드별 질의로 요청 수를 줄인다.
  #
  #    ⚠️ 서비스키는 저장소 Secret 'G2B_SERVICE_KEY' 로 넣는다.
  #       공공데이터포털의 '디코딩 키'를 써야 한다('인코딩 키'는 이중 인코딩됨).
  #       키가 없으면 이 소스는 '건너뜀'으로 처리되고 경고를 띄우지 않는다.
  # ─────────────────────────────────────────────────────────────
  - id: g2b-servc
    name: 나라장터 용역입찰
    org: 나라장터
    kind: g2b_bid
    enabled: true
    key_env: G2B_SERVICE_KEY
    base_url: https://apis.data.go.kr/1230000/ad/BidPublicInfoService
    operation: getBidPblancListInfoServc      # 용역 입찰공고 목록
    board_url: https://www.g2b.go.kr/
    page_size: 100
    region_keywords: ["서울"]                  # 공고기관/수요기관 이름으로 걸러낸다
    query_keywords:
      - 나무의사
      - 수목진료
      - 수목진단
      - 수목치료
      - 수목관리
      - 수목전정
      - 병해충
      - 예찰
      - 방제
      - 가로수
      - 조경관리
      - 녹지관리
      - 산림병해충
      - 재선충
      - 수목보호

  # ─────────────────────────────────────────────────────────────
  # 6. 미해결 — 실측 시 접근 불가. 활성화하면 매 실행마다 헬스 경고가 뜬다.
  #    성북구: www.seongbuk.go.kr / www.sb.go.kr 모두 불통(2026-08-04),
  #            seongbuk.eminwon.seoul.kr 은 400. 도메인 재확인 필요.
  # ─────────────────────────────────────────────────────────────
  - {id: gu-seongbuk,    name: 성북구 고시공고,  org: 성북구, kind: generic_table, enabled: false,
     list_url: "https://www.sb.go.kr/", note: "도메인 불통 — 확인 후 활성화"}
