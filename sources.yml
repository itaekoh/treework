  - {id: gu-gwanak-r,    name: 관악구 채용공고,  org: 관악구, kind: generic_table, enabled: true,
     list_url: "https://www.gwanak.go.kr/site/gwanak/ex/bbsNew/List.do?typeCode=4"}
  - {id: gu-gwangjin-n,  name: 광진구 고시공고,  org: 광진구, kind: generic_table, enabled: true,
     list_url: "https://www.gwangjin.go.kr/portal/bbs/B0000378/list.do?menuNo=200192"}
  - {id: gu-gwangjin-r,  name: 광진구 채용정보,  org: 광진구, kind: generic_table, enabled: true,
     list_url: "https://www.gwangjin.go.kr/portal/bbs/B0000004/list.do?menuNo=200193"}
  - {id: gu-guro-n,      name: 구로구 고시공고,  org: 구로구, kind: generic_table, enabled: true,
     list_url: "https://www.guro.go.kr/www/selectBbsNttList.do?bbsNo=663&key=1791"}
  - {id: gu-guro-r,      name: 구로구 채용정보,  org: 구로구, kind: generic_table, enabled: true,
     list_url: "https://www.guro.go.kr/www/selectBbsNttList.do?bbsNo=664&key=1792"}
  - {id: gu-ddm-n,       name: 동대문구 고시공고, org: 동대문구, kind: generic_table, enabled: true,
     list_url: "https://www.ddm.go.kr/www/selectEminwonWebList.do?key=3291"}
  - {id: gu-ddm-r,       name: 동대문구 채용공고, org: 동대문구, kind: generic_table, enabled: true,
     list_url: "https://www.ddm.go.kr/www/selectBbsNttList.do?bbsNo=42&key=208"}
  - {id: gu-mapo-n,      name: 마포구 고시공고,  org: 마포구, kind: generic_table, enabled: true,
     list_url: "https://www.mapo.go.kr/site/main/nPortal/list"}
  - {id: gu-sdm-n,       name: 서대문구 고시공고, org: 서대문구, kind: generic_table, enabled: true,
     list_url: "https://www.sdm.go.kr/news/notice/notice.do", link_mode: list}
  - {id: gu-sdm-r,       name: 서대문구 채용공고, org: 서대문구, kind: generic_table, enabled: true,
     list_url: "https://www.sdm.go.kr/genre/economic/jobinfo/jobs.do", link_mode: list}
  - {id: gu-seongdong-n, name: 성동구 고시공고,  org: 성동구, kind: generic_table, enabled: true,
