# 서울 공공기관 수목/나무의사 관련 공고 수집 대상
#
# 모든 URL과 파라미터는 2026-08-04 기준 실측 검증했습니다.
# 검증 방법과 결과는 README.md의 "소스 검증 기록" 참고.
#
# kind 별 처리기:
#   seoul_job_portal : job.seoul.go.kr 공공일자리 (POST, 최우선 소스)
#   seoul_notice     : www.seoul.go.kr 고시공고 (GET, 본문 HTML 전문 제공)
#   eminwon          : <구>.eminwon.seoul.kr 공통 고시공고 시스템 (POST)
#   generic_table    : 범용 테이블 파서 (구청별 CMS가 6종 이상으로 갈려 휴리스틱 사용)

defaults:
  timeout: 25
  rate_limit_sec: 1.2
  retries: 2
  # 목록에서 이 일수 이내 등록분만 신규 후보로 본다 (중복 방지 파일과 병행)
  lookback_days: 21

sources:
  # ─────────────────────────────────────────────────────────────
  # 1. 최우선: 서울시 일자리포털 공공일자리
  #    서울시 본청 전 부서 + 사업소 + 산하기관/재단/민간위탁 채용을 통합.
  #    목록에 마감일이 이미 포함되고 pageSize 200까지 지원. CSRF 불필요.
  #    ※ 자치구는 포함되지 않음 → 아래 eminwon/generic 소스가 담당.
  # ─────────────────────────────────────────────────────────────
  - id: seoul-job-public
    name: 서울시 일자리포털(공공일자리)
    org: 서울특별시
    kind: seoul_job_portal
    enabled: true
    list_url: https://job.seoul.go.kr/hmpg/rmim/pjmg/pjmgListPgng.do
    referer: https://job.seoul.go.kr/hmpg/rmim/pjmg/pjmgListPage.do
    detail_template: https://job.seoul.go.kr/hmpg/rmim/pjmg/pjmgDetail.do?pbc_recmnt_mng_no={id}
    page_size: 200
    # 상세요강 필드가 대부분 비어 있고 실제 내용이 .hwpx 첨부에 있음 → 첨부 파싱 필수
    parse_attachments: true

  # ─────────────────────────────────────────────────────────────
  # 2. 서울시 고시공고 (채용 외 용역/모집 공고가 여기로 나오는 경우 대응)
  #    상세 페이지에 HWP 본문이 HTML로 변환되어 전문 포함 → 본문 검색 가능.
  #    ※ 사이트 자체 검색은 본문 인덱싱이 빈약해 신뢰 불가 → 목록 전량 크롤 후 로컬 필터.
  # ─────────────────────────────────────────────────────────────
  - id: seoul-notice
    name: 서울시 고시·공고
    org: 서울특별시
    kind: seoul_notice
    enabled: true
    list_url: https://www.seoul.go.kr/news/news_notice.do
    bbs_no: 277
    page_size: 50
    pages: 2
    parse_attachments: false   # 본문 HTML에 전문이 있어 첨부 파싱 불필요

  # ─────────────────────────────────────────────────────────────
  # 3. 자치구 — eMinwon 공통 시스템 (8개 구, POST)
  #    상세는 POST 전용이라 공유 링크가 없음 → 링크는 구청 게시판으로 대체하고
  #    고시공고번호를 함께 표기한다.
  # ─────────────────────────────────────────────────────────────
  - {id: gu-gangnam,   name: 강남구 고시공고,  org: 강남구,  kind: eminwon, enabled: true,
     host: gangnam.eminwon.seoul.kr,   board_url: "https://www.gangnam.go.kr/notice/list.do?mid=ID05_040201"}
  - {id: gu-gangbuk,   name: 강북구 고시공고,  org: 강북구,  kind: eminwon, enabled: true,
     host: gangbuk.eminwon.seoul.kr,   board_url: "https://www.gangbuk.go.kr/"}
  - {id: gu-geumcheon, name: 금천구 고시공고,  org: 금천구,  kind: eminwon, enabled: true,
     host: geumcheon.eminwon.seoul.kr, board_url: "https://www.geumcheon.go.kr/"}
  - {id: gu-nowon,     name: 노원구 고시공고,  org: 노원구,  kind: eminwon, enabled: true,
     host: nowon.eminwon.seoul.kr,     board_url: "https://www.nowon.kr/www/user/bbs/BD_selectBbsList.do?q_bbsCode=1003"}
  - {id: gu-dobong,    name: 도봉구 고시공고,  org: 도봉구,  kind: eminwon, enabled: true,
     host: dobong.eminwon.seoul.kr,    board_url: "https://www.dobong.go.kr/Contents.asp?code=10008772"}
  - {id: gu-dongjak,   name: 동작구 고시공고,  org: 동작구,  kind: eminwon, enabled: true,
     host: dongjak.eminwon.seoul.kr,   board_url: "https://www.dongjak.go.kr/portal/bbs/B0001297/list.do?menuNo=201317"}
  - {id: gu-seocho,    name: 서초구 고시공고,  org: 서초구,  kind: eminwon, enabled: true,
     host: eminwon.seocho.go.kr,       board_url: "https://www.seocho.go.kr/site/seocho/05/10506020000002015070811.jsp"}
  - {id: gu-yangcheon, name: 양천구 고시공고,  org: 양천구,  kind: eminwon, enabled: true,
     host: yangcheon.eminwon.seoul.kr, board_url: "https://www.yangcheon.go.kr/site/yangcheon/ex/seol/seolCollectList.do"}

